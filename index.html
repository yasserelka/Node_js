<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Client API Node.js</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .post { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; background: #f9f9f9; }
        .post h3 { margin-top: 0; color: #333; }
        button { cursor: pointer; padding: 8px 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; }
        button:hover { background: #c0392b; }
        form { margin-bottom: 30px; padding: 20px; background: #ecf0f1; border-radius: 5px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #bdc3c7; border-radius: 4px; }
        .btn-add { background: #2ecc71; width: auto; }
        .btn-add:hover { background: #27ae60; }
    </style>
</head>
<body>
    <h1>📝 Gestion des Posts</h1>
    
    <h2>Ajouter un post</h2>
    <form id="postForm">
        <input type="number" id="userId" placeholder="User ID (ex: 1)" required>
        <input type="text" id="title" placeholder="Titre du post" required>
        <textarea id="body" placeholder="Contenu du post" rows="3" required></textarea>
        <button type="submit" class="btn-add">Ajouter le post</button>
    </form>

    <h2>Liste des posts</h2>
    <div id="postsList">Chargement en cours...</div>

    <script>
        const API_URL = 'http://localhost:3000/api/posts';

        async function loadPosts() {
            try {
                const res = await fetch(API_URL);
                const posts = await res.json();
                const container = document.getElementById('postsList');
                container.innerHTML = '';
                
                // Affiche les 10 derniers posts pour ne pas surcharger la page
                posts.slice(-10).reverse().forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <h3>${post.title} <small>(ID: ${post.id})</small></h3>
                        <p>${post.body}</p>
                        <button onclick="deletePost(${post.id})">Supprimer</button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('postsList').innerText = 'Erreur de chargement.';
            }
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPost = {
                userId: parseInt(document.getElementById('userId').value),
                title: document.getElementById('title').value,
                body: document.getElementById('body').value
            };
            
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });
            
            e.target.reset();
            loadPosts();
        });

        async function deletePost(id) {
            if(confirm('Voulez-vous vraiment supprimer ce post ?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadPosts();
            }
        }

        // Chargement initial
        loadPosts();
    </script>
</body>
</html>
